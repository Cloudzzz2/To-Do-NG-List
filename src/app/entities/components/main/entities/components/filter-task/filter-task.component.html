<div [formGroup]="filtersForm" 
     class="filter-task">
        <div class="sort-and-filters">
            <dx-select-box [dataSource]="prioritiesFilter"
                           [formControlName]="LFilterForm.PRIORITY_FILTER"
                           [valueExpr]="LIcon.VALUE"
                           [displayExpr]="LIcon.TEXT"
                           label="Фильтр по приоритету"
                           labelMode="static"
                           class="sort-and-filters__priority-select"/>
            <div class="checkbox-group">
                <div class="checkbox-group__nazvanie">
                    Фильтр по статусу:
                </div>
                <span class="checkbox-group__checkbox-text">активные</span>
                <dx-check-box [formControlName]="LFilterForm.STATUS_ACTIVE"/>
                <span class="checkbox-group__checkbox-text">отменённые</span>
                <dx-check-box [formControlName]="LFilterForm.STATUS_CANCELED"/>
                <span class="checkbox-group__checkbox-text">завершённые</span>
                <dx-check-box [formControlName]="LFilterForm.STATUS_COMPLETED"/>
            </div>
        </div>
        <div class="sorts">
            <app-custom-field-select-box [dataSourceForSelectBox]="dates"
                                         [formControlForSelectBox]="filtersForm.controls[LFilterForm.DATE_SORT]"
                                         labelName="Сортировка по дате"
                                         className="sorts__date-select"/>
            <app-custom-field-select-box [dataSourceForSelectBox]="priorities"
                                         [formControlForSelectBox]="filtersForm.controls[LFilterForm.PRIORITY_SORT]"
                                         labelName="Сортировка по приоритету"
                                         className="sorts__priority-select"/>
        </div>
        <dx-autocomplete [formControlName]="LFilterForm.SEARCH"
                         placeholder="Начните вводить текст задачи..."
                         label="Поиск задачи по тексту"
                         labelMode="static"
                         class="search-task"/>
    </div>
