<div class="tasks">
    <div *ngIf="!tasks.length; else task"
         class="text-array-is-empty-container">
        <p class="text-array-is-empty">Список задач пуст</p>
    </div>
    <ng-template #task>
        <div *ngFor="let task of tasks | filters : filtersFormData"
             class="task-container">
             <div class="task-area-and-status">
                <span [ngClass]="task[LTask.PRIORITY] === EPriority.LOW ? 'priority-text-low' 
                : task[LTask.PRIORITY] === EPriority.MEDIUM ? 'priority-text-medium'
                : 'priority-text-high'">
                    {{ task[LTask.PRIORITY_TEXT] | uppercase }}
                </span>
                <dx-autocomplete [ngClass]="task[LTask.STATUS] === EStatus.CANCELED ? 'task-field-canceled' 
                                 : task.status === EStatus.ACTIVE ? 'task-field-active' : 'task-field-completed'"
                                 [(value)]="task[LTask.TEXT]"
                                 (onChange)="editTask(task)"/>
                <span class="cross-check-span">
                    <dx-button *ngIf="task[LTask.STATUS] !== EStatus.COMPLETED"
                               (onClick)="changeStatus(task, true)"
                               icon="check"/>
                    <dx-button *ngIf="task[LTask.STATUS] !== EStatus.CANCELED"
                               (onClick)="changeStatus(task, false)"
                               icon="remove"/>
                </span>
                <dx-button (onClick)="deleteTask(task[LTask.ID])"
                           icon="trash"
                           class="delete-button"/>
            </div>
            <div class="date-container">
                {{ task[LTask.DATE] | date : 'dd.MM.yyyy HH:mm' }}
            </div>
        </div>
    </ng-template>  
</div>
